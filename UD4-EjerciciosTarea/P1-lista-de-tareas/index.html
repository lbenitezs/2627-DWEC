<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas 2.0</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="tarjeta">
    <h1>Lista de tareas</h1>

    <form id="form-tarea">
      <label for="tarea">Nueva tarea</label>
      <div class="fila">
        <input id="tarea" name="tarea" type="text" placeholder="¿Qué tienes que hacer?" autocomplete="off">
        <button type="submit">Añadir</button>
      </div>
      <p id="mensaje" class="mensaje" role="alert"></p>
    </form>

    <div class="filtros" id="filtros">
      <button type="button" data-filtro="todas" class="activo">Todas</button>
      <button type="button" data-filtro="pendientes">Pendientes</button>
      <button type="button" data-filtro="hechas">Hechas</button>
    </div>

    <ul id="lista"></ul>

    <p id="contador" class="contador"></p>
  </main>
</body>
</html>
